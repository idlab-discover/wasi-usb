[package]
name = "webcam"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
log = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.42.1"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
# NOTE: This project uses plain `cargo build`, not `cargo-component`.
# The world field below is documentation only; WIT embedding is done
# manually via `wasm-tools component embed` in the Justfile.
package = "component:webcam"

[package.metadata.component.target]
path = "../../../wit"
world = "webcam-guest"

[package.metadata.component.dependencies]
"wasi:cli" = "0.2.5"
"wasi:clocks" = "0.2.5"
"wasi:random" = "0.2.5"
"wasi:sockets" = "0.2.5"
"wasi:io" = "0.2.5"
"wasi:filesystem" = "0.2.5"
